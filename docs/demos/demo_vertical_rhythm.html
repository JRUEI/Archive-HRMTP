<!doctype html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>版面留白調整 · はるまとぺーじ</title>
<style>
  :root{
    --ground:#09090b;      /* zinc-950  站台底色 */
    --card:#18181b;        /* zinc-900  卡片 */
    --line:#27272a;        /* zinc-800  邊框 */
    --ink:#fafafa;
    --muted:#a1a1aa;
    --dim:#71717a;
    --purple:#c084fc;
    --green:#34d399;
    --chrome:#111113;      /* demo 外殼 */
    --chrome2:#1a1a1e;
    --accent:#c084fc;
  }
  *{box-sizing:border-box}
  body{
    margin:0;padding:32px 28px 72px;
    background:var(--chrome);color:var(--ink);
    font:400 14px/1.6 -apple-system,"Segoe UI","PingFang TC","Microsoft JhengHei",sans-serif;
  }
  .wrap{max-width:1400px;margin:0 auto}

  h1{margin:0 0 6px;font-size:22px;font-weight:800;letter-spacing:-.01em}
  .sub{color:var(--muted);margin:0 0 4px}
  .warn{
    display:inline-block;margin:14px 0 26px;padding:7px 14px;border-radius:999px;
    background:rgba(192,132,252,.12);border:1px solid rgba(192,132,252,.35);
    color:var(--purple);font-size:12.5px;font-weight:700;
  }

  /* ---------- 控制列 ---------- */
  .panel{
    background:var(--chrome2);border:1px solid var(--line);border-radius:14px;
    padding:20px 22px;margin-bottom:26px;
  }
  .presets{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:20px}
  .presets button{
    padding:8px 15px;border-radius:999px;cursor:pointer;
    background:#26262b;border:1px solid #35353c;color:var(--muted);
    font:700 13px/1 inherit;transition:.15s;
  }
  .presets button:hover{color:var(--ink);border-color:#4a4a55}
  .presets button.on{background:var(--purple);border-color:var(--purple);color:#1a1020}

  .sliders{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px 24px}
  .sl label{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
  .sl .nm{font-size:12.5px;color:var(--muted);font-weight:600}
  .sl .val{font-size:12.5px;font-weight:800;font-variant-numeric:tabular-nums}
  .sl .cls{font:600 11px/1 ui-monospace,"Cascadia Mono",Consolas,monospace;color:var(--dim)}
  .sl input{width:100%;accent-color:var(--purple);cursor:pointer}

  /* ---------- 兩欄比較 ---------- */
  .panes{display:grid;grid-template-columns:1fr 1fr;gap:22px}
  @media (max-width:900px){.panes{grid-template-columns:1fr}}
  .pane{background:var(--chrome2);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .paneHead{
    padding:11px 16px;border-bottom:1px solid var(--line);
    display:flex;justify-content:space-between;align-items:baseline;gap:10px;
  }
  .paneHead b{font-size:13.5px}
  .paneHead .tot{font:700 12px/1 ui-monospace,Consolas,monospace;color:var(--dim);font-variant-numeric:tabular-nums}
  .fit{position:relative;padding:14px 118px 14px 14px;background:var(--chrome2)}
  .vp{transform-origin:top left;background:var(--ground);border:1px solid var(--line);border-radius:8px;overflow:hidden}
  .rulers{position:absolute;inset:14px 14px 14px 0;pointer-events:none}

  /* 尺標 */
  .mark{position:absolute;right:0;width:104px;border-top:1px dashed rgba(192,132,252,.55);border-bottom:1px dashed rgba(192,132,252,.55);
        display:flex;align-items:center;justify-content:flex-start}
  .mark::before{content:"";position:absolute;left:0;top:0;bottom:0;width:1px;background:rgba(192,132,252,.35)}
  .mark span{padding-left:9px;line-height:1.25}
  .mark .px{display:block;font:800 12px/1.2 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;color:var(--purple)}
  .mark .who{display:block;font-size:10.5px;color:var(--dim);white-space:nowrap}
  .mark.tiny span{padding-left:9px}
  .mark.tiny .who{display:none}
  .mark.chg{border-color:rgba(52,211,153,.6)}
  .mark.chg::before{background:rgba(52,211,153,.4)}
  .mark.chg .px{color:var(--green)}

  /* ---------- 模擬頁面（1280px 座標系） ---------- */
  .mock{width:1280px}
  .m-nav{height:65px;border-bottom:1px solid var(--line);display:flex;align-items:center;
         padding:0 24px;background:rgba(9,9,11,.9)}
  .m-navin{max-width:1152px;margin:0 auto;width:100%}
  .m-navrow{max-width:896px;margin:0 auto;display:flex;align-items:center;justify-content:space-between}
  .m-mark{font-weight:900;font-size:22px;letter-spacing:-.02em}
  .m-mark i{font-style:normal;background:linear-gradient(90deg,var(--purple),var(--green));
            -webkit-background-clip:text;background-clip:text;color:transparent}
  .m-icons{display:flex;gap:8px}
  .m-icons b{width:38px;height:38px;border-radius:999px;background:#26262b;display:block}
  .m-body{max-width:1152px;margin:0 auto;padding:0 24px}
  .m-list{max-width:896px;margin:0 auto}
  .m-row{display:flex;gap:16px}
  .m-date{width:112px;text-align:right;padding-top:26px;color:var(--dim);font-size:14px;flex:none}
  .m-rail{width:32px;flex:none;position:relative}
  .m-dot{position:absolute;top:36px;left:50%;transform:translate(-50%,-50%);width:16px;height:16px;
         border-radius:999px;background:#3f3f46}
  .m-line{position:absolute;top:36px;bottom:-32px;left:50%;transform:translateX(-50%);width:4px;background:#27272a}
  .m-card{flex:1;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px}
  .m-pills{display:flex;gap:8px;margin-bottom:16px}
  .m-pill{height:31px;border-radius:999px;background:#27272a}
  .m-title{height:36px;border-radius:6px;background:#3f3f46;margin-bottom:16px;width:72%}
  .m-text{height:14px;border-radius:4px;background:#27272a;margin-bottom:8px}
  .m-break{display:flex;align-items:center;justify-content:center;height:56px;color:var(--dim);font-size:13px;
           letter-spacing:.08em}
  .m-foot{border-top:1px solid var(--line)}
  .m-footin{max-width:1152px;margin:0 auto;padding-left:24px;padding-right:24px}
  .m-footrow{max-width:896px;margin:0 auto}
  .m-fmark{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}
  .m-fmark .b{font-weight:900;font-size:16px}
  .m-fbtn{width:150px;height:38px;border-radius:999px;background:#18181b;border:1px solid var(--line)}
  .m-fdiv{border-top:1px solid #18181b;padding-top:24px}
  .m-flabel{height:11px;width:60px;border-radius:3px;background:#3f3f46;margin-bottom:14px}
  .m-fline{height:12px;border-radius:3px;background:#27272a;margin-bottom:10px}

  /* 留白視覺化 */
  .gapband{position:relative;background:
      repeating-linear-gradient(45deg,rgba(192,132,252,.07) 0 6px,transparent 6px 12px)}
  .gapband.chg{background:
      repeating-linear-gradient(45deg,rgba(52,211,153,.09) 0 6px,transparent 6px 12px)}

  /* ---------- 對照表 ---------- */
  table{width:100%;border-collapse:collapse;margin-top:26px;font-size:13px}
  caption{text-align:left;font-weight:800;font-size:15px;padding:0 0 10px}
  th,td{padding:9px 12px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
  th{color:var(--dim);font-weight:700;font-size:11.5px;letter-spacing:.06em}
  td.n{font:700 13px/1.5 ui-monospace,Consolas,monospace;font-variant-numeric:tabular-nums;white-space:nowrap}
  td.n.up{color:var(--green)}
  td.n.same{color:var(--dim)}
  code{font:600 12px/1.5 ui-monospace,"Cascadia Mono",Consolas,monospace;
       background:#26262b;border:1px solid #33333a;border-radius:5px;padding:1px 6px;color:#e4e4e7}
  .file{color:var(--dim);font-size:11.5px}
  .foot{margin-top:30px;color:var(--dim);font-size:12.5px;line-height:1.8}
</style>
</head>
<body>
<div class="wrap">

  <h1>版面留白調整</h1>
  <p class="sub">首頁縱向間距，1280px 桌機寬度。左邊是現在跑起來量到的實際數值，右邊是調整後。</p>
  <div class="warn">預覽用，程式碼還沒動</div>

  <div class="panel">
    <div class="presets" id="presets"></div>
    <div class="sliders" id="sliders"></div>
  </div>

  <div class="panes">
    <div class="pane">
      <div class="paneHead"><b>現況</b><span class="tot" id="totA"></span></div>
      <div class="fit" id="fitA"><div class="vp" id="vpA"></div><div class="rulers" id="rulA"></div></div>
    </div>
    <div class="pane">
      <div class="paneHead"><b>調整後</b><span class="tot" id="totB"></span></div>
      <div class="fit" id="fitB"><div class="vp" id="vpB"></div><div class="rulers" id="rulB"></div></div>
    </div>
  </div>

  <table>
    <caption>要改哪裡</caption>
    <thead><tr><th>項目</th><th>現況</th><th>調整後</th><th>Tailwind</th><th>檔案</th></tr></thead>
    <tbody id="tbody"></tbody>
  </table>

  <p class="foot">
    「末卡 → 頁尾」＝ 外框下內距 ＋ 列表 <code>mb</code>，所以現在才會是 64 + 80 = 144，比上面的 64 多了一倍有餘。<br>
    這裡調的是 <code>sm:</code> 以上的桌機值；手機（<code>sm</code> 以下）目前是 <code>py-10</code> / <code>gap-6</code>，套用時我會按同樣比例縮。
  </p>
</div>

<script>
(function(){
  // Tailwind 間距刻度（只讓滑桿停在真的有對應 class 的值上）
  var SCALE = [0,8,12,16,20,24,28,32,40,48,56,64,80,96,112,128];
  var CLS   = [0, 2, 3, 4, 5, 6, 7, 8,10,12,14,16,20,24,28, 32];

  var FIELDS = [
    { key:'pt',   nm:'外框上內距',      prefix:'sm:pt-', file:'src/app/page.tsx' },
    { key:'gap',  nm:'卡片間距',        prefix:'sm:gap-', file:'src/components/HomeEpisodeList.tsx' },
    { key:'mb',   nm:'列表下方額外留白', prefix:'mb-',    file:'src/components/HomeEpisodeList.tsx' },
    { key:'pb',   nm:'外框下內距',      prefix:'sm:pb-', file:'src/app/page.tsx' },
    { key:'fpy',  nm:'頁尾內距',        prefix:'sm:py-', file:'src/components/Footer.tsx' }
  ];

  var CURRENT = { pt:64, gap:32, mb:80, pb:64, fpy:48 };

  var PRESETS = [
    { nm:'現況',      v:{ pt:64, gap:32, mb:80, pb:64, fpy:48 } },
    { nm:'A 上下對稱', v:{ pt:64, gap:32, mb:0,  pb:64, fpy:48 } },
    { nm:'B 緊湊',    v:{ pt:40, gap:24, mb:0,  pb:48, fpy:40 } },
    { nm:'C 寬鬆',    v:{ pt:80, gap:40, mb:0,  pb:96, fpy:64 } }
  ];

  var state = Object.assign({}, PRESETS[1].v);

  function idxOf(px){
    var best=0, d=1e9;
    for(var i=0;i<SCALE.length;i++){ var t=Math.abs(SCALE[i]-px); if(t<d){d=t;best=i;} }
    return best;
  }
  function clsOf(px){ return CLS[idxOf(px)]; }

  // ---------- 模擬頁面 ----------
  function card(){
    return '<div class="m-card">'
      + '<div class="m-pills"><div class="m-pill" style="width:96px"></div><div class="m-pill" style="width:132px"></div></div>'
      + '<div class="m-title"></div>'
      + '<div class="m-text" style="width:100%"></div><div class="m-text" style="width:86%"></div>'
      + '</div>';
  }
  function row(){
    return '<div class="m-row"><div class="m-date">2026-08-22</div>'
      + '<div class="m-rail"><div class="m-line"></div><div class="m-dot"></div></div>'
      + card() + '</div>';
  }
  // 留白一律做成實體 div，尺標之後直接量它們的位置，不用推算座標
  function band(h, chg, who, label){
    return '<div class="gapband'+(chg?' chg':'')+'" style="height:'+h+'px"'
         + (who ? ' data-who="'+who+'" data-px="'+(label===undefined?h:label)+'"' : '')
         + '></div>';
  }

  function build(v, base){
    var html = '';
    var bottom = v.mb + v.pb;

    html += '<div class="m-nav"><div class="m-navin"><div class="m-navrow">'
          + '<div class="m-mark">福嶋晴菜の<i>「はるまとぺーじ」</i></div>'
          + '<div class="m-icons"><b></b><b></b><b></b></div>'
          + '</div></div></div>';

    html += '<div class="m-body">'
          + band(v.pt, v.pt !== base.pt, '頁首 → 首卡')
          + '<div class="m-list">';
    html += row();
    html += band(v.gap, v.gap !== base.gap, '卡片間距');
    html += row();
    html += band(v.gap, v.gap !== base.gap);
    html += '<div class="m-break">⋯ 中間 7 張卡片 ⋯</div>';
    html += band(v.gap, v.gap !== base.gap);
    html += row();
    html += '</div>'                                        // /m-list
          + band(bottom, bottom !== (base.mb + base.pb), '末卡 → 頁尾')
          + '</div>';                                       // /m-body

    html += '<div class="m-foot">'
          + '<div class="m-footin" style="padding-bottom:'+v.fpy+'px">'
          + band(v.fpy, v.fpy !== base.fpy, '頁尾上內距')
          + '<div class="m-footrow">'
          + '<div class="m-fmark"><div class="b">福嶋晴菜の「はるまとぺーじ」</div><div class="m-fbtn"></div></div>'
          + '<div class="m-fdiv"><div class="m-flabel"></div>'
          + '<div class="m-fline" style="width:88%"></div><div class="m-fline" style="width:64%"></div>'
          + '<div class="m-fline" style="width:74%"></div></div>'
          + '</div></div></div>';

    return '<div class="mock">' + html + '</div>';
  }

  function paint(vpId, rulId, fitId, totId, v, base){
    var vp = document.getElementById(vpId);
    vp.style.transform = 'none';
    vp.style.width = '1280px';
    vp.innerHTML = build(v, base);

    var total = vp.offsetHeight;                     // 未縮放時的真實高度
    var fit = document.getElementById(fitId);
    var avail = fit.clientWidth - 118 - 14;          // 扣掉尺標欄與左內距
    var k = avail / 1280;

    // 縮放前先量好每段留白的實際位置
    var bands = vp.querySelectorAll('.gapband[data-who]');
    var vpTop = vp.getBoundingClientRect().top;
    var out = '';
    for (var i=0;i<bands.length;i++){
      var el = bands[i], r = el.getBoundingClientRect();
      var top = (r.top - vpTop) * k;
      var h = Math.max(r.height * k, 1);
      var chg = el.className.indexOf('chg') !== -1;
      out += '<div class="mark'+(chg?' chg':'')+(h<26?' tiny':'')+'" style="top:'+top+'px;height:'+h+'px">'
           + '<span><em class="px">'+el.getAttribute('data-px')+'px</em>'
           + '<em class="who">'+el.getAttribute('data-who')+'</em></span></div>';
    }

    vp.style.transform = 'scale(' + k + ')';
    fit.style.height = Math.ceil(total * k) + 28 + 'px';
    document.getElementById(rulId).innerHTML = out;
    document.getElementById(totId).textContent = '總高 ' + total + 'px';
  }

  function table(){
    var rows = '';
    for (var i=0;i<FIELDS.length;i++){
      var f = FIELDS[i], a = CURRENT[f.key], b = state[f.key];
      var same = a === b;
      rows += '<tr><td>'+f.nm+'</td>'
            + '<td class="n same">'+a+'px</td>'
            + '<td class="n '+(same?'same':'up')+'">'+b+'px</td>'
            + '<td><code>'+f.prefix+clsOf(b)+'</code></td>'
            + '<td class="file">'+f.file+'</td></tr>';
    }
    var da = CURRENT.mb + CURRENT.pb, db = state.mb + state.pb;
    rows += '<tr><td><b>末卡 → 頁尾</b>（合計）</td><td class="n same">'+da+'px</td>'
          + '<td class="n '+(da===db?'same':'up')+'">'+db+'px</td><td class="file">兩項相加</td><td></td></tr>';
    document.getElementById('tbody').innerHTML = rows;
  }

  function render(){
    paint('vpA','rulA','fitA','totA', CURRENT, CURRENT);
    paint('vpB','rulB','fitB','totB', state,   CURRENT);
    table();
    for (var i=0;i<FIELDS.length;i++){
      var f = FIELDS[i];
      document.getElementById('v_'+f.key).textContent = state[f.key] + 'px';
      document.getElementById('c_'+f.key).textContent = f.prefix + clsOf(state[f.key]);
      document.getElementById('r_'+f.key).value = idxOf(state[f.key]);
    }
    var btns = document.querySelectorAll('#presets button');
    for (var j=0;j<btns.length;j++){
      var p = PRESETS[j].v, on = true;
      for (var k2 in p) if (p[k2] !== state[k2]) on = false;
      btns[j].className = on ? 'on' : '';
    }
  }

  // ---------- 介面 ----------
  var sl = '';
  for (var i=0;i<FIELDS.length;i++){
    var f = FIELDS[i];
    sl += '<div class="sl"><label><span class="nm">'+f.nm+'</span>'
        + '<span><span class="val" id="v_'+f.key+'"></span> '
        + '<span class="cls" id="c_'+f.key+'"></span></span></label>'
        + '<input type="range" id="r_'+f.key+'" min="0" max="'+(SCALE.length-1)+'" step="1" data-key="'+f.key+'"></div>';
  }
  document.getElementById('sliders').innerHTML = sl;

  var pb = '';
  for (var p=0;p<PRESETS.length;p++) pb += '<button data-i="'+p+'">'+PRESETS[p].nm+'</button>';
  document.getElementById('presets').innerHTML = pb;

  document.getElementById('sliders').addEventListener('input', function(e){
    var key = e.target.getAttribute('data-key');
    if (!key) return;
    state[key] = SCALE[+e.target.value];
    render();
  });
  document.getElementById('presets').addEventListener('click', function(e){
    var i = e.target.getAttribute('data-i');
    if (i === null) return;
    state = Object.assign({}, PRESETS[+i].v);
    render();
  });
  window.addEventListener('resize', render);

  render();
  setTimeout(render, 120);
  window.addEventListener('load', render);
})();
</script>
</body>
</html>
