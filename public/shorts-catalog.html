    let currentTag = 'all';
    let currentView = 'table';

    function render() {
      const searchVal = document.getElementById('search-input').value.trim().toLowerCase();
      const epVal = document.getElementById('ep-select').value;
      const durVal = document.getElementById('dur-select').value;

      const filtered = CATALOG.filter(item => {
        // Tag filter
        if (currentTag !== 'all' && !item.labels.includes(currentTag)) return false;
        // EP filter
        if (epVal !== 'all' && item.ep !== epVal) return false;
        // Duration filter
        if (durVal === 'short' && item.duration > 60) return false;
        if (durVal === 'medium' && (item.duration <= 60 || item.duration > 80)) return false;
        if (durVal === 'long' && item.duration <= 80) return false;
        // Search filter
        if (searchVal) {
          const matchStr = (item.title + item.hookLine + item.editingNotes + item.guest + item.labels.join(' ')).toLowerCase();
          if (!matchStr.includes(searchVal)) return false;
        }
        return true;
      });

      // Update stat
      document.getElementById('stat-total').textContent = `${filtered.length} 則`;

      renderTable(filtered);
      renderCards(filtered);
    }

    function renderTable(items) {
      const tbody = document.getElementById('table-body');
      if (items.length === 0) {
        tbody.innerHTML = `<tr><td colspan="7" class="py-12 text-center text-zinc-500 font-mono">查無符合條件的切片推薦，請嘗試更換篩選條件。</td></tr>`;
        return;
      }

      tbody.innerHTML = items.map(item => {
        const ytLink = `https://www.youtube.com/watch?v=${item.youtube}&t=${item.startSec}s`;
        const ytdlpCmd = `yt-dlp --download-sections "*${item.startSec}-${item.endSec}" "https://www.youtube.com/watch?v=${item.youtube}" -o "${item.ep}_${item.start.replace(':', '')}_clip.mp4"`;

        const badgesHtml = item.labels.map(l => {
          let colorCls = 'bg-zinc-800 text-zinc-300 border-zinc-700/60';
          if (l === '爆笑' || l === '放送事故') colorCls = 'bg-rose-500/15 text-rose-300 border-rose-500/30';
          if (l === '名場面' || l === '入坑必看') colorCls = 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30';
          if (l === '聲優反差' || l === '相聲漫才') colorCls = 'bg-indigo-500/15 text-indigo-300 border-indigo-500/30';
          if (l === '美食安利' || l === '可愛') colorCls = 'bg-amber-500/15 text-amber-300 border-amber-500/30';
          return `<span class="inline-block px-1.5 py-0.5 rounded text-[10px] font-medium border ${colorCls} badge-pop">#${l}</span>`;
        }).join(' ');

        return `
          <tr class="hover:bg-zinc-800/40 transition-colors group">
            <!-- EP -->
            <td class="py-3 px-3.5 text-center font-mono font-bold text-zinc-400">
              <span class="px-2 py-1 rounded bg-[var(--background,#09090b)] border border-[var(--border,#27272a)] text-xs text-rose-400">
                ${item.ep.toUpperCase()}
              </span>
              <div class="text-[10px] text-zinc-500 mt-1 truncate max-w-[70px] mx-auto">${item.guest}</div>
            </td>

            <!-- Time & Duration -->
            <td class="py-3 px-3 font-mono">
              <div class="text-zinc-200 font-semibold text-xs flex items-center gap-1">
                <span>⏱️</span> ${item.start} - ${item.end}
              </div>
              <div class="text-[11px] text-zinc-400 mt-0.5">
                <span class="px-1.5 py-0.2 rounded bg-zinc-800 font-bold text-amber-300">${item.duration}s</span>
              </div>
            </td>

            <!-- Hook Title -->
            <td class="py-3 px-3.5 font-medium text-zinc-100">
              <div class="font-bold text-sm text-[var(--foreground,#fafafa)] group-hover:text-rose-400 transition-colors leading-snug">
                ${item.title}
              </div>
            </td>

            <!-- Hook Line (Quotes) -->
            <td class="py-3 px-3.5 text-zinc-300">
              <div class="bg-[var(--background,#09090b)]/70 p-2 rounded-lg border border-[var(--border,#27272a)]/70 text-xs italic text-zinc-300 leading-relaxed">
                “${item.hookLine}”
              </div>
            </td>

            <!-- Labels -->
            <td class="py-3 px-3">
              <div class="flex flex-wrap gap-1">
                ${badgesHtml}
              </div>
            </td>

            <!-- Editing Notes -->
            <td class="py-3 px-3.5 text-xs text-zinc-400 leading-relaxed">
              <div class="bg-zinc-900/40 p-2 rounded-lg border border-zinc-800/60">
                💡 ${item.editingNotes}
              </div>
            </td>

            <!-- Actions -->
            <td class="py-3 px-3.5 text-center space-y-1.5 shrink-0">
              <a
                href="${ytLink}"
                target="_blank"
                rel="noreferrer"
                class="inline-flex items-center justify-center gap-1 w-full px-2.5 py-1.5 rounded-lg text-xs font-semibold bg-rose-500/15 hover:bg-rose-500 text-rose-400 hover:text-white border border-rose-500/30 transition-all"
                title="在 YouTube 另開視窗並跳至精準秒數"
              >
                <span>▶</span> 聽原片
              </a>
              <button
                onclick="copyText('${item.start} - ${item.end} (${item.duration}s) ${item.title.replace(/'/g, "\\'")}', '已複製剪輯時間碼！')"
                class="inline-flex items-center justify-center gap-1 w-full px-2 py-1 rounded-lg text-[11px] font-medium bg-zinc-800 hover:bg-zinc-700 text-zinc-300 transition-all"
                title="複製剪輯時碼 (如 02:15 - 03:35)"
              >
                📋 複製時碼
              </button>
              <button
                onclick="copyText('${ytdlpCmd.replace(/'/g, "\\'")}', '已複製 yt-dlp 下載指令！')"
                class="inline-flex items-center justify-center gap-1 w-full px-2 py-1 rounded-lg text-[10px] font-mono bg-zinc-900 hover:bg-zinc-800 text-zinc-400 hover:text-zinc-200 border border-zinc-800 transition-all"
                title="複製 yt-dlp 自動下載此秒數片段的指令"
              >
                ⚡ yt-dlp指令
              </button>
            </td>
          </tr>
        `;
      }).join('');
    }

    function renderCards(items) {
      const container = document.getElementById('view-card-container');
      container.innerHTML = items.map(item => {
        const ytLink = `https://www.youtube.com/watch?v=${item.youtube}&t=${item.startSec}s`;
        const ytdlpCmd = `yt-dlp --download-sections "*${item.startSec}-${item.endSec}" "https://www.youtube.com/watch?v=${item.youtube}" -o "${item.ep}_${item.start.replace(':', '')}_clip.mp4"`;

        return `
          <div class="bg-[var(--card,#18181b)] border border-[var(--border,#27272a)] rounded-2xl p-5 space-y-3 hover:border-zinc-700 transition-all shadow-sm flex flex-col justify-between">
            <div class="space-y-2">
              <div class="flex items-center justify-between gap-2">
                <div class="flex items-center gap-2">
                  <span class="px-2 py-0.5 rounded text-xs font-mono font-bold bg-rose-500/20 text-rose-400 border border-rose-500/30">
                    ${item.ep.toUpperCase()}
                  </span>
                  <span class="text-xs text-zinc-400">${item.guest}</span>
                </div>
                <div class="font-mono text-xs text-amber-400 font-semibold bg-zinc-900 px-2 py-0.5 rounded border border-zinc-800">
                  ⏱️ ${item.start} - ${item.end} (${item.duration}s)
                </div>
              </div>

              <h3 class="font-bold text-base text-[var(--foreground,#fafafa)] leading-snug">
                ${item.title}
              </h3>

              <div class="bg-[var(--background,#09090b)] p-3 rounded-xl border border-[var(--border,#27272a)] text-xs italic text-zinc-300">
                “${item.hookLine}”
              </div>

              <div class="text-xs text-zinc-400 leading-relaxed bg-zinc-900/40 p-2.5 rounded-xl border border-zinc-800/60">
                💡 <strong>剪輯建議：</strong>${item.editingNotes}
              </div>
            </div>

            <div class="pt-3 border-t border-[var(--border,#27272a)] flex items-center justify-between gap-2">
              <div class="flex flex-wrap gap-1">
                ${item.labels.map(l => `<span class="px-1.5 py-0.5 rounded text-[10px] bg-zinc-800 text-zinc-300">#${l}</span>`).join('')}
              </div>
              <div class="flex items-center gap-1.5 shrink-0">
                <button
                  onclick="copyText('${item.start} - ${item.end} (${item.duration}s) ${item.title.replace(/'/g, "\\'")}', '已複製時碼！')"
                  class="px-2.5 py-1 rounded-lg text-xs bg-zinc-800 hover:bg-zinc-700 text-zinc-300"
                >
                  📋
                </button>
                <a
                  href="${ytLink}"
                  target="_blank"
                  rel="noreferrer"
                  class="px-3 py-1 rounded-lg text-xs font-semibold bg-rose-500 text-white hover:bg-rose-600 transition-colors"
                >
                  ▶ 播放
                </a>
              </div>
            </div>
          </div>
        `;
      }).join('');
    }

    function selectTag(tag) {
      currentTag = tag;
      document.querySelectorAll('.tag-btn').forEach(btn => {
        if (btn.dataset.tag === tag) {
          btn.className = 'tag-btn active px-2.5 py-1 rounded-lg text-xs font-semibold bg-rose-500 text-white transition-all';
        } else {
          btn.className = 'tag-btn px-2.5 py-1 rounded-lg text-xs bg-zinc-800 text-zinc-300 hover:bg-zinc-700 transition-all';
        }
      });
      render();
    }

    function handleFilter() {
      render();
    }

    function setViewMode(mode) {
      currentView = mode;
      const tableCont = document.getElementById('view-table-container');
      const cardCont = document.getElementById('view-card-container');
      const btnTable = document.getElementById('btn-table');
      const btnCard = document.getElementById('btn-card');

      if (mode === 'table') {
        tableCont.classList.remove('hidden');
        cardCont.classList.add('hidden');
        btnTable.className = 'px-3 py-2 text-xs font-semibold bg-rose-500 text-white transition-all';
        btnCard.className = 'px-3 py-2 text-xs text-zinc-400 hover:text-white transition-all';
      } else {
        tableCont.classList.add('hidden');
        cardCont.classList.remove('hidden');
        btnTable.className = 'px-3 py-2 text-xs text-zinc-400 hover:text-white transition-all';
        btnCard.className = 'px-3 py-2 text-xs font-semibold bg-rose-500 text-white transition-all';
      }
    }

    function copyText(text, msg) {
      navigator.clipboard.writeText(text).then(() => {
        showToast(msg);
      }).catch(err => {
        // fallback
        const ta = document.createElement('textarea');
        ta.value = text;
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
        showToast(msg);
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast');
      const toastMsg = document.getElementById('toast-msg');
      toastMsg.textContent = msg;
      toast.classList.remove('translate-y-20', 'opacity-0');
      setTimeout(() => {
        toast.classList.add('translate-y-20', 'opacity-0');
      }, 2200);
    }

    // Initial render
    render();
  </script>
